<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Train Gauge Model</title>
</head>
<body>
  <h2>Train Gauge Model</h2>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
        {% for msg in messages %}
          <li>{{ msg }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <form method="post">
    <button type="submit">Start Training</button>
  </form>

  <br>
  <a href="{{ url_for('index') }}">⬅ Back to Home</a>
</body>
</html>
